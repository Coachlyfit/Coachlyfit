name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy, non-secret values so `next build` succeeds without touching any
  # real Supabase project. `next build` only statically renders pages that
  # don't call createClient() at build time (see src/lib/supabase/server.ts
  # — it's a per-request function, not a module-level side effect), so a
  # DNS-unresolvable placeholder is fine here. If build ever needs a real
  # secret at build time, it will fail here naming the missing var — that's
  # the signal to move that read to runtime instead of adding a real secret
  # to CI.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit tests only. Full `npm test` also runs tests/rls/**, which
      # creates real auth users against whatever Supabase project the env
      # points at -- CI has no .env.local/.env.test.local, so it stays out.
      - run: npx vitest run src/

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # The root layout's generateMetadata calls getPlatformSettings(),
      # which queries Supabase on every request -- including the public
      # marketing/login/signup pages this suite hits. A DNS-unresolvable
      # placeholder URL (fine for `next build`, which never serves a
      # request) makes every page 500 once the server actually starts. So
      # `next start` here needs a real, reachable Supabase -- the same
      # disposable local stack the db-types job uses, never a real project.
      - run: supabase start
      - name: Resolve local Supabase URL/key
        run: |
          API_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')
          echo "SUPABASE_LOCAL_API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_LOCAL_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_LOCAL_API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_LOCAL_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_LOCAL_API_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_LOCAL_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Full local stack (Postgres + Auth + Storage) so migrations that
      # reference auth.users, auth.uid(), storage.buckets/objects, etc.
      # apply exactly as they do in local dev -- never touches the real
      # hosted project, no prod credentials involved.
      - run: supabase start
      - name: Check generated types are in sync with migrations
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          if ! diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts; then
            echo "::error::src/lib/supabase/database.types.ts is out of sync with supabase/migrations/. Regenerate it (see CLAUDE.md: Supabase MCP generate_typescript_types) and commit the result."
            exit 1
          fi
